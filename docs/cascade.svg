<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">One forecast changes three files</title><desc id="desc">Synthetic rain changes from 10 to 90 percent. The picnic moves to Moss Library, the packing list changes to board games and mugs, and the invitation draft follows. An unrelated source field rebuilds nothing.</desc>
<rect width="1200" height="420" rx="22" fill="#f3f2e9"/>
<g fill="#173f35" font-family="system-ui,sans-serif"><text x="48" y="55" font-size="13" letter-spacing="2">SPROUTFILE / ONE SMALL PROMISE</text><text x="48" y="105" font-family="Georgia,serif" font-size="40">The plan changes. The spoon stays.</text></g>
<g stroke="#d3dbce" fill="#fffef8"><rect x="48" y="145" width="250" height="180" rx="14"/><rect x="335" y="145" width="250" height="180" rx="14"/><rect x="622" y="145" width="250" height="180" rx="14"/><rect x="909" y="145" width="243" height="180" rx="14"/></g>
<g fill="#173f35" font-family="system-ui,sans-serif"><g font-size="12" letter-spacing="1"><text x="70" y="176">WEATHER.JSON</text><text x="357" y="176">PICNIC.SPROUT.HTML</text><text x="644" y="176">PACKING.SPROUT.HTML</text><text x="931" y="176">INVITATION.SPROUT.HTML</text></g><g font-family="Georgia,serif" font-size="28"><text x="70" y="220">Rain: 10% → 90%</text><text x="357" y="220">Let's go indoors.</text><text x="644" y="220">New bag contents.</text><text x="931" y="220">A different draft.</text></g><g font-size="16"><text x="70" y="262">A synthetic forecast.</text><text x="70" y="289">No network needed.</text><text x="357" y="262">Fern Park →</text><text x="357" y="289">Moss Library</text><text x="644" y="262">Board games, mugs,</text><text x="644" y="289">suspicious spoon.</text><text x="931" y="262">New venue + packing.</text><text x="931" y="289">Never sent.</text></g></g>
<g fill="#2c6651" font-family="system-ui,sans-serif" font-size="27"><text x="305" y="245">→</text><text x="592" y="245">→</text><text x="879" y="245">→</text></g>
<text x="48" y="377" fill="#587368" font-family="system-ui,sans-serif" font-size="16">Deterministic demo · 0 model calls · 0 network calls · An unrelated field changes? Nothing rebuilds.</text>
</svg>
